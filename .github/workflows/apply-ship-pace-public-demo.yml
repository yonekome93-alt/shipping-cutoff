name: Apply SHIP PACE public demo safety patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ship-pace-public-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply completed public-demo safety changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('index.html',
          '''    .mode-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 18px;padding:12px 15px;border-radius:14px;background:#fff8e8;border:1px solid #edd9aa;color:#7b5519}.mode-bar[hidden]{display:none}.mode-bar b{display:block}.mode-bar small{display:block;margin-top:2px}''',
          '''    .mode-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-6px 0 18px;padding:12px 15px;border-radius:14px;background:#eef6fb;border:1px solid #c9dcea;color:#3f627e}.mode-bar[hidden]{display:none}.mode-bar b{display:block;color:#174d76;letter-spacing:.08em}.mode-bar small{display:block;margin-top:3px;line-height:1.55}.public-demo-hidden,#activeWorkersPanel,.future-panel,#authScreen,section.panel:has(#personalRanking),details.panel:has(#workerMasterList),section.panel:has(#productivityContent),section.panel:has(#dailyReport){display:none!important}.demo-input-note{margin:0 0 16px;padding:11px 13px;border-radius:12px;background:#fff8e8;border:1px solid #ead7a2;color:#795a20;font-size:12px;line-height:1.65}''')

          replace_once('index.html',
          '''    <header><div class="brand"><div class="mark"><img src="./ship-pace-icon.png" alt=""></div><div><b>SHIP PACE</b><small>方面別 出荷締切ナビ</small></div></div><div class="ops-status"><button id="syncStatus" class="sync" onclick="openLogin()">端末保存</button><span id="lastSyncText" class="last-sync">未共有</span><button id="testModeButton" class="secondary" onclick="toggleTestMode()">テストモード</button><button class="help-trigger" type="button" onclick="openUsageGuide()" aria-haspopup="dialog" aria-controls="usageGuide">？ 使い方</button></div><div class="live"><i></i>LIVE</div></header>
    <div id="testModeBar" class="mode-bar" hidden><div><b>テストモード実行中</b><small>入力内容は本番・クラウドへ反映されません。</small></div><button class="secondary" onclick="toggleTestMode()">本番へ戻る</button></div>''',
          '''    <header><div class="brand"><div class="mark"><img src="./ship-pace-icon.png" alt=""></div><div><b>SHIP PACE</b><small>方面別 出荷締切ナビ</small></div></div><div class="ops-status"><button id="syncStatus" class="sync" disabled>DEMO MODE</button><span id="lastSyncText" class="last-sync">端末内保存のみ</span><button id="testModeButton" class="secondary" onclick="resetPublicDemo()">デモをリセット</button><button class="help-trigger" type="button" onclick="openUsageGuide()" aria-haspopup="dialog" aria-controls="usageGuide">？ 使い方</button></div><div class="live">PUBLIC DEMO</div></header>
    <div id="testModeBar" class="mode-bar"><div><b>PUBLIC DEMO / PROTOTYPE</b><small>入力内容はこのブラウザ内のデモ領域（localStorage）だけに保存され、本番・共有環境・クラウドには送信されません。実際の顧客名・個人名・店舗情報・作業ID・物量・機密情報は入力しないでください。</small></div><button class="secondary" onclick="resetPublicDemo()">デモをリセット</button></div>
    <p class="demo-input-note">表示される方面名・作業ID・数値は公開デモ用のサンプルです。ページを再読み込みしても同じ端末には状態が残るため、終了時は「デモをリセット」を押してください。</p>''')

          replace_once('index.html',
          '''  <div id="authScreen" class="auth"><section class="auth-card"><div class="eyebrow">CLOUD SHARING</div><h2>共通PIN</h2><p>全員共通の4桁PINを入力すると、スマホとパソコンで同じ進捗を共有できます。</p><input id="sharedPin" type="password" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="4桁PIN"><button class="primary" onclick="unlockSharedPin()">共通PINで開始</button><button class="secondary" onclick="closeLogin()">端末保存のまま使う</button><p id="authMessage" class="auth-message"></p></section></div>''',
          '''  <div id="authScreen" class="auth public-demo-hidden" aria-hidden="true"><input id="sharedPin" type="hidden"><p id="authMessage"></p></div>''')

          replace_once('index.html',
          '''    const STORAGE='shipping-cutoff-standalone-v1';
    const TEST_STORAGE='shipping-cutoff-test-v1';''',
          '''    const STORAGE='shipping-cutoff-public-demo-v1';
    const TEST_STORAGE='shipping-cutoff-public-demo-v1';''')

          replace_once('index.html',
          '''    const SB_URL='https://ygbxyejhfeieqhgdymys.supabase.co';
    const SB_KEY='sb_publishable_kQvjwG8nKu1YGM_3qlZ-Vg_ok3jlvIW';
    const SB_HEADERS={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
    const WORKSPACE_ID='4dad83ad-0fb0-451f-b375-49595c06e538';''',
          '''    const PUBLIC_DEMO=true;
    const SB_URL='';
    const SB_HEADERS={};
    const WORKSPACE_ID='';''')

          replace_once('index.html',
          '''    let isTestMode=localStorage.getItem(TEST_MODE_KEY)==='1';''',
          '''    let isTestMode=true;''')

          replace_once('index.html',
          '''      testModeBar.hidden=!isTestMode;testModeButton.textContent=isTestMode?'本番へ戻る':'テストモード';voiceButton.textContent=voiceEnabled?'音声案内：ON':'音声案内を有効化';''',
          '''      testModeBar.hidden=false;testModeButton.textContent='デモをリセット';voiceButton.textContent=voiceEnabled?'音声案内：ON':'音声案内を有効化';''')

          replace_once('index.html',
          '''      if(isTestMode){setSync('テスト中');return true}''',
          '''      if(PUBLIC_DEMO||isTestMode){setSync('DEMO MODE');return true}''')

          replace_once('index.html',
          '''      if(isTestMode||!pin||cloudBusy)return false;cloudBusy=true;setSync('読込中');''',
          '''      if(PUBLIC_DEMO||isTestMode||!pin||cloudBusy)return false;cloudBusy=true;setSync('読込中');''')

          replace_once('index.html',
          '''      if(!pin||isTestMode)return false;''',
          '''      if(PUBLIC_DEMO||!pin||isTestMode)return false;''')

          replace_once('index.html',
          '''      if(!sharedPinValue||isTestMode)return false;''',
          '''      if(PUBLIC_DEMO||!sharedPinValue||isTestMode)return false;''')

          replace_once('index.html',
          '''    function toggleTestMode(){
      if(!isTestMode){
        persist();const existing=localStorage.getItem(TEST_STORAGE);if(!existing)localStorage.setItem(TEST_STORAGE,JSON.stringify({...JSON.parse(JSON.stringify(state)),auditLog:[],undoStack:[],syncRevision:'',syncDevice:''}));
        isTestMode=true;localStorage.setItem(TEST_MODE_KEY,'1');state=load(TEST_STORAGE);setSync('テスト中');lastSyncText.textContent='クラウドへ保存しません';
      }else{
        isTestMode=false;localStorage.setItem(TEST_MODE_KEY,'0');state=load(STORAGE);setSync(sharedPinValue?'共有済み':'PIN未認証',sharedPinValue?'ok':'');lastSyncText.textContent=cloudUpdatedAt?`最終共有 ${new Date(cloudUpdatedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`:'未共有';
      }
      lastStableState=JSON.parse(JSON.stringify(state));render();scrollTo({top:0,behavior:'smooth'});
    }
    function openLogin(){if(isTestMode){saveMessage.textContent='テストモード中はクラウド共有しません。';return}if(sharedPinValue){loadCloudState();return}authScreen.classList.add('open');setTimeout(()=>sharedPin.focus(),50)}''',
          '''    function resetPublicDemo(){
      if(!confirm('公開デモの入力値・進捗・履歴・表示状態を初期状態に戻しますか？'))return;
      [TEST_STORAGE,TEST_MODE_KEY,PENDING_SYNC_KEY,COMPLETION_GUARD_KEY,PIN_SESSION].forEach(key=>{localStorage.removeItem(key);sessionStorage.removeItem(key)});
      sharedPinValue='';longTermReports=[];reportsLoaded=false;saveConflict=false;formDirty=false;isTestMode=true;localStorage.setItem(TEST_MODE_KEY,'1');state=load(TEST_STORAGE);lastStableState=JSON.parse(JSON.stringify(state));render();setSync('DEMO MODE');lastSyncText.textContent='端末内保存のみ';scrollTo({top:0,behavior:'smooth'});
    }
    function toggleTestMode(){resetPublicDemo()}
    function openLogin(){saveMessage.textContent='公開デモではクラウド共有を使用できません。';}''')

          replace_once('index.html',
          '''    async function resumePendingSync(pin){sharedPinValue=pin;lastCloudRevision=state.syncRevision||'';const pending=pendingSync(),saved=pending?await saveCloudState(pending.changeType||'shipping_update'):await loadCloudState(pin);if(saved)sessionStorage.setItem(PIN_SESSION,pin);return saved}
    async function unlockSharedPin(){const pin=sharedPin.value.trim();if(!/^\\d{4}$/.test(pin)){authMessage.textContent='4桁の数字を入力してください。';return}authMessage.textContent='確認中…';lastCloudAuthError=null;if(await resumePendingSync(pin)){authMessage.textContent='共有を開始しました。';closeLogin()}else if(lastCloudAuthError?.code==='rate_limited'){const mins=Math.max(1,Math.ceil(lastCloudAuthError.retryAfterSeconds/60));authMessage.textContent=`PINの連続入力に失敗したため、約${mins}分後に再度お試しください。`}else authMessage.textContent=pendingSync()?'未共有データを端末に保持しています。通信を確認して再度お試しください。':'PINが違うか、クラウドの初回設定が未完了です。'}
    async function bootstrapCloud(){if(isTestMode){setSync('テスト中');lastSyncText.textContent='クラウドへ保存しません';return}localStorage.removeItem(PIN_SESSION);sharedPinValue=sessionStorage.getItem(PIN_SESSION)||'';if(sharedPinValue){if(await resumePendingSync(sharedPinValue))closeLogin()}else setSync(pendingSync()?'未共有データあり':'PIN未認証',pendingSync()?'error':'')}''',
          '''    async function resumePendingSync(pin){if(PUBLIC_DEMO)return false;sharedPinValue=pin;lastCloudRevision=state.syncRevision||'';const pending=pendingSync(),saved=pending?await saveCloudState(pending.changeType||'shipping_update'):await loadCloudState(pin);if(saved)sessionStorage.setItem(PIN_SESSION,pin);return saved}
    async function unlockSharedPin(){if(PUBLIC_DEMO){authMessage.textContent='公開デモではクラウド共有を利用できません。';return}const pin=sharedPin.value.trim();if(!/^\\d{4}$/.test(pin)){authMessage.textContent='4桁の数字を入力してください。';return}authMessage.textContent='確認中…';lastCloudAuthError=null;if(await resumePendingSync(pin)){authMessage.textContent='共有を開始しました。';closeLogin()}else if(lastCloudAuthError?.code==='rate_limited'){const mins=Math.max(1,Math.ceil(lastCloudAuthError.retryAfterSeconds/60));authMessage.textContent=`PINの連続入力に失敗したため、約${mins}分後に再度お試しください。`}else authMessage.textContent=pendingSync()?'未共有データを端末に保持しています。通信を確認して再度お試しください。':'PINが違うか、クラウドの初回設定が未完了です。'}
    async function bootstrapCloud(){isTestMode=true;sharedPinValue='';localStorage.setItem(TEST_MODE_KEY,'1');localStorage.removeItem(PIN_SESSION);sessionStorage.removeItem(PIN_SESSION);clearPendingSync();setSync('DEMO MODE');lastSyncText.textContent='端末内保存のみ'}''')

          replace_once('index.html',
          '''    <script src="./ship-pace-ops.js?v=47"></script>''',
          '''    <script src="./ship-pace-ops.js?v=48"></script>''')

          replace_once('ops-v37-regression.test.mjs',
          r'''test('v1.0.1候補: 通信失敗後は未共有印を保持し、再読込時にローカル状態を先に再送する',()=>{
  const html=readFileSync(new URL('./index.html',import.meta.url),'utf8');
  assert.match(html,/const PENDING_SYNC_KEY='shipping-cutoff-pending-sync-v1'/u);
  assert.match(html,/markPendingSync\(changeType\)/u);
  assert.match(html,/else if\(sharedPinValue\)formDirty=true/u);
  assert.match(html,/clearPendingSync\(\);persist\(\);return true/u);
  assert.match(html,/async function resumePendingSync\(pin\)[\s\S]*?pending\?await saveCloudState\(pending\.changeType\|\|'shipping_update'\):await loadCloudState\(pin\)/u);
  assert.match(html,/bootstrapCloud\(\)[\s\S]*?resumePendingSync\(sharedPinValue\)/u);
  assert.match(html,/unlockSharedPin\(\)[\s\S]*?resumePendingSync\(pin\)/u);
});''',
          r'''test('PUBLIC DEMO: クラウド共有経路を固定停止し、接続情報を公開版へ含めない',()=>{
  const html=readFileSync(new URL('./index.html',import.meta.url),'utf8');
  assert.match(html,/const PUBLIC_DEMO=true/u);
  assert.match(html,/const SB_URL=''/u);
  assert.match(html,/const WORKSPACE_ID=''/u);
  assert.match(html,/saveCloudState\(changeType='shipping_update'\)\{\s*if\(PUBLIC_DEMO\|\|isTestMode\)/u);
  assert.match(html,/loadCloudState\(pin=sharedPinValue,\{background=false\}=\{\}\)\{\s*if\(PUBLIC_DEMO\|\|isTestMode/u);
  assert.match(html,/resumePendingSync\(pin\)\{if\(PUBLIC_DEMO\)return false/u);
  assert.match(html,/unlockSharedPin\(\)\{if\(PUBLIC_DEMO\)/u);
});''')

          replace_once('sw.js',
          "const CACHE='shipping-cutoff-v47';",
          "const CACHE='shipping-cutoff-v48-public-demo';")
          PY
      - name: Run regression tests
        run: node --test ops-v37-regression.test.mjs
      - name: Commit and publish
        shell: bash
        run: |
          rm .github/workflows/apply-ship-pace-public-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ops-v37-regression.test.mjs sw.js .github/workflows/apply-ship-pace-public-demo.yml
          git diff --cached --check
          git commit -m "Apply SHIP PACE public demo safety patch"
          git push origin HEAD:main
